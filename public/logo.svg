<svg xmlns="http://www.w3.org/2000/svg" width="232" height="56" viewBox="0 0 232 56" role="img" aria-label="Lookout">
  <title>Lookout</title>
  <!-- Eye mark -->
  <g transform="translate(4 4)" fill="none" stroke="#5b8def" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 24 C12 13 36 13 43 24 C36 35 12 35 5 24 Z" />
    <circle cx="24" cy="24" r="8.4" />
  </g>
  <circle cx="28" cy="28" r="3.6" fill="#ff8a5b" />
  <!-- Wordmark: "Look" charcoal + "out" italic cornflower (mirrors site header) -->
  <text x="66" y="38" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#17191f">Look</tspan><tspan fill="#5b8def" font-style="italic">out</tspan>
  </text>
</svg>
